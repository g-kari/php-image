name: Validate official AL2 SRPM security backport
on:
  push:
    branches: [build-al2-parity]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'g-kari/php-image' && github.ref == 'refs/heads/build-al2-parity'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        series: ['7.4', '8.0', '8.1', '8.2']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify vendor source and exact upstream security patch without publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          base="$(python3 -c 'import json;print(json.load(open("al2-official/source-lock.json"))["base"])')"
          docker run --rm --platform linux/amd64 --memory 2g --cpus 2 --pids-limit 256 \
            -e CI_DISPOSABLE_BUILD=1 -v "$PWD:/work:ro" -v "$PWD/out:/out" \
            "$base" bash /work/al2-official/prepare.sh '${{ matrix.series }}' 2>&1 | tee out/preparation.log
          grep -q '^OFFICIAL_SECURITY_PATCH_PREPARATION_PASSED ' out/preparation.log
      - name: No binary publication in this preparation stage
        run: echo "Only signed official SRPM acquisition and full upstream patch application are tested. Build, ABI/runtime, independent review and publication are not yet complete."
