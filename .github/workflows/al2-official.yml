name: Verify and distribute official-layout AL2 PHP RPMs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: official-al2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      official: ${{ steps.scope.outputs.official }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: |
          python3 scripts/classify-ci.py --self-test
          python3 scripts/classify-ci.py
  verify:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.official == 'true'
    name: Diagnostic official AL2 PHP ${{ matrix.series }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        series: ['8.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Official PHPT plus exact packaged cohort runtime, update and rollback
        run: bash al2-official/ci.sh '${{ matrix.series }}'
  diagnostic-scope-hold:
    needs: [changes, verify]
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.official == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "8.1 evidence diagnosis only. All-series final-head PR verification and publication remain blocked."
          exit 1
  publish:
    needs: changes
    if: false
    # Diagnostic-only head: no publication even if this temporary workflow reaches main.
    name: Build test publish official AL2 PHP ${{ matrix.series }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        series: ['7.4', '8.0', '8.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: All gates on the exact artifacts without publication credentials
        run: bash al2-official/ci.sh '${{ matrix.series }}'
      - name: Publish this exact tested binary cohort and full SRPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash al2-official/publish.sh '${{ matrix.series }}'
