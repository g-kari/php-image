name: Publish verified mitigation artifacts
on:
  workflow_run:
    workflows: ['Verify legacy PHP builds']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Publish ${{ matrix.target }} PHP ${{ matrix.series }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: al2, series: '7.4', gate: 'AL2 PHP 7.4 x86_64'}
          - {target: al2, series: '8.0', gate: 'AL2 PHP 8.0 x86_64'}
          - {target: al2, series: '8.1', gate: 'AL2 PHP 8.1 x86_64'}
          - {target: fpm, series: '7.4', gate: 'PHP 7.4 FPM linux/amd64'}
          - {target: fpm, series: '8.0', gate: 'PHP 8.0 FPM linux/amd64'}
          - {target: fpm, series: '8.1', gate: 'PHP 8.1 FPM linux/amd64'}
    steps:
      - name: Gate the exact trusted commit and series-specific successful check
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          GATE_NAME: ${{ matrix.gate }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$current" != "$VERIFIED_SHA" ]; then
            echo "Skip superseded verification commit"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json
          if jq -e --arg gate "$GATE_NAME" 'any(.jobs[]; .name == $gate and .conclusion == "success")' jobs.json >/dev/null; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skip failed or incomplete target $GATE_NAME"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.gate.outputs.selected == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        if: steps.gate.outputs.selected == 'true' && matrix.target == 'fpm'
        with:
          buildkitd-flags: --debug
          cache-binary: false
      - name: Rebuild and retest the actual publication artifacts without credentials
        if: steps.gate.outputs.selected == 'true'
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ '${{ matrix.target }}' = al2 ]; then
            bash scripts/ci-al2.sh '${{ matrix.series }}'
          else
            bash scripts/ci-container.sh '${{ matrix.series }}'
          fi
      - name: Publish only artifacts that passed this job's own tests
        if: steps.gate.outputs.selected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/publish-verified.sh '${{ matrix.target }}' '${{ matrix.series }}'
