name: Build test and distribute PHP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: php-distribution-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'push'
    name: Read-only ${{ matrix.target }} PHP ${{ matrix.series }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: al2, series: '7.4'}
          - {target: al2, series: '8.0'}
          - {target: al2, series: '8.1'}
          - {target: al2, series: '8.2'}
          - {target: fpm, series: '7.4'}
          - {target: fpm, series: '8.0'}
          - {target: fpm, series: '8.1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read-only build and runtime verification
        run: |
          if [ '${{ matrix.target }}' = al2 ]; then
            bash scripts/ci-al2.sh '${{ matrix.series }}'
          else
            bash scripts/ci-container.sh '${{ matrix.series }}'
          fi
  publish-al2:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'g-kari/php-image'
    name: Build test publish AL2 PHP ${{ matrix.series }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Explicit maintenance marker avoids rebuilding six already-published, unchanged targets.
        # It reduces the matrix only; all source/build/runtime/publication gates still run.
        series: ${{ fromJSON(contains(github.event.head_commit.message, '[al2-8.2-only]') && '["8.2"]' || '["7.4","8.0","8.1","8.2"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and test this series without publication credentials
        run: bash scripts/ci-al2.sh '${{ matrix.series }}'
      - name: Publish only this exact tested RPM and SRPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-verified.sh al2 '${{ matrix.series }}'
  publish-fpm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'g-kari/php-image' && !contains(github.event.head_commit.message, '[al2-8.2-only]')
    name: Build test publish FPM PHP ${{ matrix.series }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        series: ['7.4', '8.0', '8.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and test both OPcache modes without publication credentials
        run: bash scripts/ci-container.sh '${{ matrix.series }}'
      - name: Publish only this exact tested Docker image
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-verified.sh fpm '${{ matrix.series }}'
